[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-intuition"
version = "0.1.0"
description = "A chess policy network with a strictly search-free intuition mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "python-chess>=1.999",
]

[project.optional-dependencies]
train = ["torch>=2.10"]

[project.scripts]
chess-intuition-preprocess = "chess_intuition.data.preprocess:main"
chess-intuition-train = "chess_intuition.training.train:main"
chess-intuition-evaluate = "chess_intuition.training.evaluate:main"
chess-intuition-evaluate-first-move = "chess_intuition.training.evaluate_first_move:main"
chess-intuition-benchmark-puzzles = "chess_intuition.training.benchmark_puzzles:main"
chess-intuition-estimate-puzzle-glicko = "chess_intuition.training.estimate_puzzle_glicko:main"
chess-intuition-move = "chess_intuition.play:main"
chess-intuition-gui = "chess_intuition.gui:main"
bilari-uci = "chess_intuition.uci:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_intuition = ["web/*.html", "web/*.css", "web/*.js"]
